server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA, falling back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend Service by its in-cluster DNS name.
    # This means the browser only ever talks to the frontend origin,
    # so there's no CORS configuration needed on the backend at all.
    location /api/ {
        proxy_pass http://footprint-backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same for uploaded photo files
    location /uploads/ {
        proxy_pass http://footprint-backend:4000/uploads/;
    }
}
