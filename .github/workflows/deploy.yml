name: Deploy to OpenShift

# Runs on every push to main. Only the app that actually changed gets
# rebuilt, using path filters so an edit to just the frontend doesn't
# waste a backend build cycle, and vice versa.
on:
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install oc CLI
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: issailyas05-dev
          insecure_skip_tls_verify: true

      - name: Trigger backend build
        run: oc start-build footprint-backend --follow

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install oc CLI
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: "latest"

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: issailyas05-dev
          insecure_skip_tls_verify: true

      - name: Trigger frontend build
        run: oc start-build footprint-frontend --follow
